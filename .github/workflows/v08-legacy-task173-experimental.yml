name: v08-legacy-task173-experimental

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version for historical replay
        required: true
        default: "3.11"
        type: choice
        options:
          - "3.11"
          - "3.12"

permissions:
  contents: read

jobs:
  legacy-independent-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      TZ: "UTC"
      LC_ALL: "C.UTF-8"
      HXFORGE_LEGACY_EXPERIMENTAL_V08_TASK173: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.11.25"
      - run: uv sync --locked --all-extras
      - name: Run superseded Task173 independent heavy test
        env:
          PYTHONPATH: "."
          PYTEST_TIMEOUT: "7200"
        run: |
          uv run --locked python -m tests.ci.run_test_shard \
            --timeout=7200 -q \
            tests/prototypes/test_v08_thermal_rating_independent_case_heavy.py